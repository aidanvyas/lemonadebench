[project]
name = "lemonadebench"
version = "0.1.0"
description = "Economic reasoning benchmark for AI models through lemonade stand simulation"
authors = [
    { name = "Aidan Vyas", email = "68206970+aidanvyas@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.5.0",
    "requests>=2.28.0",
    "tiktoken>=0.11.0",
    "tqdm>=4.67.1",
]

[project.scripts]
lemonadebench = "lemonadebench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/lemonadebench"]
omit = ["*/tests/*", "*/__init__.py"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.1",
    "ty>=0.0.33",
]
