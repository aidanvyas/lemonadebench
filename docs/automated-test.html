<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Game Test</title>
    <style>
        body { font-family: monospace; background: #000; color: #00ff00; padding: 20px; }
        .test-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .game-container { border: 2px solid #00ff00; }
        .log-container { background: #111; border: 2px solid #00ff00; padding: 10px; height: 600px; overflow-y: auto; }
        .log-entry { margin-bottom: 5px; font-size: 12px; }
        .log-error { color: #ff4444; }
        .log-success { color: #00ff00; }
        .log-info { color: #66aaff; }
        button { background: #333; color: #fff; border: 1px solid #666; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:hover { background: #444; }
        .status { font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>🤖 Automated Game Test</h1>
    <div class="status" id="status">Ready to start</div>
    <button onclick="startAutomatedTest()">🚀 Start Automated Test</button>
    <button onclick="clearLog()">Clear Log</button>
    
    <div class="test-container">
        <div class="game-container">
            <iframe src="/" id="gameFrame" width="100%" height="600px"></iframe>
        </div>
        <div class="log-container" id="logContainer">
            <div class="log-entry log-info">🤖 Automated test ready. Click 'Start Automated Test' to begin.</div>
        </div>
    </div>

    <script>
        let testRunning = false;
        let gameFrame = null;
        let gameWindow = null;
        let gameDocument = null;
        let testStep = 0;
        
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `[${timestamp}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
        }
        
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }
        
        function waitForElement(selector, timeout = 5000) {
            return new Promise((resolve, reject) => {
                const startTime = Date.now();
                
                function check() {
                    const element = gameDocument.querySelector(selector);
                    if (element) {
                        resolve(element);
                    } else if (Date.now() - startTime > timeout) {
                        reject(new Error(`Timeout waiting for element: ${selector}`));
                    } else {
                        setTimeout(check, 100);
                    }
                }
                
                check();
            });
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function clickElement(selector, description) {
            try {
                log(`🔍 Looking for ${description}: ${selector}`);
                const element = await waitForElement(selector, 3000);
                log(`✅ Found ${description}, clicking...`);
                element.click();
                await sleep(500); // Wait for click to process
                log(`👆 Clicked ${description}`);
                return true;
            } catch (error) {
                log(`❌ Failed to click ${description}: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function fillInput(selector, value, description) {
            try {
                log(`📝 Filling ${description} with value: ${value}`);
                const element = await waitForElement(selector, 3000);
                element.value = value;
                element.dispatchEvent(new Event('input', { bubbles: true }));
                await sleep(200);
                log(`✅ Filled ${description}`);
                return true;
            } catch (error) {
                log(`❌ Failed to fill ${description}: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function startAutomatedTest() {
            if (testRunning) return;
            testRunning = true;
            testStep = 0;
            
            updateStatus("🤖 Starting automated test...");
            clearLog();
            
            try {
                // Wait for iframe to load
                gameFrame = document.getElementById('gameFrame');
                await sleep(2000);
                
                gameWindow = gameFrame.contentWindow;
                gameDocument = gameFrame.contentDocument;
                
                if (!gameDocument) {
                    throw new Error("Could not access game iframe content");
                }
                
                log("🎮 Game iframe loaded successfully", 'success');
                
                // Override console and alert in the game iframe
                gameWindow.originalAlert = gameWindow.alert;
                gameWindow.alert = function(message) {
                    log(`🚨 ALERT DETECTED: "${message}"`, 'error');
                    updateStatus(`❌ Alert detected: ${message}`);
                    if (message === 'undefined' || message.includes('undefined')) {
                        log("🎯 FOUND THE UNDEFINED ALERT!", 'error');
                        // Try to get stack trace
                        try {
                            throw new Error('Stack trace for undefined alert');
                        } catch (e) {
                            log(`📍 Stack trace: ${e.stack}`, 'error');
                        }
                    }
                    return gameWindow.originalAlert(message);
                };
                
                // Override console to capture logs
                const originalConsole = gameWindow.console;
                gameWindow.console.log = function(...args) {
                    log(`🔧 Console: ${args.join(' ')}`);
                    originalConsole.log.apply(originalConsole, args);
                };
                
                gameWindow.console.error = function(...args) {
                    log(`❌ Console Error: ${args.join(' ')}`, 'error');
                    originalConsole.error.apply(originalConsole, args);
                };
                
                // Start the test sequence
                await runTestSequence();
                
            } catch (error) {
                log(`❌ Test failed: ${error.message}`, 'error');
                updateStatus(`❌ Test failed: ${error.message}`);
            }
            
            testRunning = false;
        }
        
        async function runTestSequence() {
            log("🚀 Starting test sequence...", 'success');
            
            // Step 1: Start new day
            updateStatus("Step 1: Starting new day");
            if (!await clickElement('#start-day-btn', 'Start Day button')) return;
            await sleep(1000);
            
            // Step 2: Order supplies
            updateStatus("Step 2: Ordering supplies");
            if (!await fillInput('#order-cups', '50', 'Cups order')) return;
            if (!await fillInput('#order-lemons', '50', 'Lemons order')) return;
            if (!await fillInput('#order-sugar', '50', 'Sugar order')) return;
            if (!await fillInput('#order-water', '50', 'Water order')) return;
            
            if (!await clickElement('#place-order-btn', 'Place Order button')) return;
            await sleep(1000);
            
            // Step 3: Set price and hours
            updateStatus("Step 3: Setting price and hours");
            if (!await fillInput('#lemonade-price', '2.50', 'Lemonade price')) return;
            // Hours should be pre-selected, but let's make sure
            
            // Step 4: Open for business (this is where the error occurs)
            updateStatus("Step 4: Opening for business - THIS IS WHERE THE ERROR OCCURS");
            log("🎯 About to click 'Open for Business' - watch for undefined alert!", 'info');
            
            if (!await clickElement('#open-for-business-btn', 'Open for Business button')) return;
            
            // Wait to see if error occurs
            await sleep(3000);
            
            log("✅ Test sequence completed!", 'success');
            updateStatus("✅ Test completed - check logs for any undefined alerts");
        }
        
        // Handle iframe load
        document.getElementById('gameFrame').addEventListener('load', function() {
            log("📡 Game iframe loaded");
        });
    </script>
</body>
</html>
